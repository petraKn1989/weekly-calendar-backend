# Port – Railway dá PORT, lokálně fallback 8080
server.port=${PORT:8080}


spring.application.name=weekly-calendar-backend

# Datasource – fallback na lokální DB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/weekly-calendar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool – OMEZENÍ PAMĚTI (Klíčová změna)
# Výchozí HikariCP otevírá až 10 spojení. Pro jednotky zápisů denně stačí bohatě 2.
# Každé spojení drží v paměti cache a thready.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false    
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Celkové vypnutí JMX (ušetří RAM na pozadí)
spring.jmx.enabled=false
# Vypnutí banneru při startu (ušetří alokaci paměti při bootu)
spring.main.banner-mode=off

# logovani

logging.level.root=INFO
logging.level.com.example.demo.service=INFO

# Tohle vypíše úplně všechno, co Spring Security dělá v pozadí
logging.level.org.springframework.security=INFO




